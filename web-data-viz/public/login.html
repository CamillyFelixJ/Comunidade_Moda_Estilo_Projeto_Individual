<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Your Style</title>

    <script src="./js/sessao.js"></script>

    <link rel="icon" href="assets/logoRcopia.png">
    <link rel="stylesheet" href="./css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="logo"><i>YOUR STYLE</i></div>
        <nav>
            <a href="paginaHOME.html">Início</a>
            <a href="#sobre">Sobre mim</a>
            <a href="#comunidade">Comunidade</a>
            <a href="#ref">Referências</a>
            <a href="#quiz">Quiz de Estilo</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastrar-se</a>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-foto">
                <img src="assets/login.png">
            </div>

            <!-- Lado direito organizado -->
            <div class="login-lado-direito">
                <div class="conteudo-login">
                    <h1>Bem vinda de volta</h1>
                    <p class="subtitulo">Entre para continuar explorando o seu estilo</p>
                </div>

                <div class="campo-input">
                    <p>E-MAIL</p>
                    <input type="email" id="ipt_email">
                </div>

                <div class="campo-input">
                    <p>SENHA</p>
                    <input type="password" id="ipt_senha">
                </div>

                <button class="botao-login">FAZER LOGIN</button>

                <p class="subtitulo-conta">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
