<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Your Style</title>

    <script src="./js/sessao.js"></script>

    <link rel="icon" href="assets/logo5.png">
    <link rel="stylesheet" href="./css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="logo"><i>YOUR STYLE</i></div>
        <nav>
            <a href="index.html">Início</a>
            <a href="sobreMim.html">Sobre mim</a>
            <a href="referencias.html">Referências</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastrar-se</a>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <div class="login-foto">
                <img src="assets/login.png">
            </div>

            <div class="login-lado-direito">
                <div class="conteudo-login">
                    <h1>Bem vinda de volta</h1>
                    <p class="subtitulo">Entre para continuar explorando o seu estilo</p>
                </div>

                <div class="campo-input">
                    <p>E-MAIL</p>
                    <input type="email" id="ipt_email">                
                    <div id="div_erroEmail"></div>
                </div>

                <div class="campo-input">
                    <p>SENHA</p>
                    <input type="password" id="ipt_senha" oninput="validarSenha()">
                    <p id="forca_senha"></p>
                    <div id="div_erroSenha"></div>
                </div>

                <button class="botao-login" onclick="entrar()">FAZER LOGIN</button>

                <div id="cardErro" style="display: none;">
                    <p id="mensagem_erro"></p>
                </div>
               
                <div id="div_aguardar" style="display: none;" class="loading">
                    <img src="assets/circle-loading.gif" width="50px">
                </div>

                <p class="subtitulo-conta">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>

        <footer class="footer">
        <div class="footer-brand">
            <div class="logo"><i>YOUR STYLE</i></div>
            <p>Descubra sua essência, estilo e autoconfiança</p>
        </div>

        <nav class="footer-nav">
            <a href="index.html">Ínicio</a>
            <a href="sobreMim.html">Sobre Mim</a>
            <a href="referencias.html">Referências</a>
        </nav>
    </footer>

</body>

</html>

<script>

    function entrar() {



        aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        var erroEmail = document.getElementById("div_erroEmail");
        var erroSenha = document.getElementById("div_erroSenha");

        erroEmail.innerHTML = "";
        erroSenha.innerHTML = "";

        if (emailVar == "") {
            erroEmail.innerHTML = "Digite seu e-mail!";
            finalizarAguardar();
            return false;
        } else if (senhaVar == "") {
            erroSenha.innerHTML = "Digite sua senha!";
            finalizarAguardar();
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {

            if (resposta.ok) {

                resposta.json().then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id_usuario;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000);
                });

            } else {

                resposta.json().then(json => {
                    finalizarAguardar();

                    //mesmo erro que está no usuarioController
                    if (json.erro == "EMAIL_NAO_ENCONTRADO") {
                        erroEmail.innerHTML = "E-mail não encontrado!";
                    } else if (json.erro == "SENHA_INCORRETA") {
                        erroSenha.innerHTML = "Senha incorreta!";
                    }
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            finalizarAguardar();
        });

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
