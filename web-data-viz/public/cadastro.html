  <main class="cadastro-container">
    <div class="cadastro-card">

      <div class="cadastro-foto">
        <img src="assets/cadastro2.png">
      </div>

      <div class="cadastro-lado-direito">
        <div class="conteudo-cadastro">
          <h1>Crie sua conta</h1>
          <p class="subtitulo">Comece sua jornada de autoconhecimento pela moda</p>
        </div>
        <div class="card_erro" id="cardErro">
          <div class="alerta_erro">
            <span id="mensagem_erro"></span>
          </div>
        </div>

        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <p>NOME</p>
            <input id="nome_input" type="text"/>
          </div>
          <div class="campo">
            <p>CPF</p>
            <input id="cpf_input" type="text"/>
          </div>
          <div class="campo">
            <p>E-MAIL</p>
            <input id="email_input" type="text"/>
          </div>
          <div class="campo">
            <p>SENHA</p>
            <input id="senha_input" type="password"/>
          </div>
          <div class="campo">
            <p>CONFIRMAÇÃO DA SENHA</p>
            <input id="confirmacao_senha_input" type="password"/>
          </div>
          <button class="botao-cadastro" onclick="cadastrar()">CADASTRAR-SE</button>
        </div>

        <div id="div_aguardar" class="loading-div" style="display: none; text-align: center; margin-top: 15px;">
          <img src="./assets/circle-loading.gif" id="loading-gif" width="35px" />
        </div>

        <div id="div_erros_login"></div>

        <p class="subtitulo-conta" style="margin-top: 20px;">Já tem uma conta? <a href="login.html">Entrar</a></p>

      </div>
    </div>
  </main>

      <footer class="footer">
        <div class="footer-brand">
            <div class="logo"><i>YOUR STYLE</i></div>
            <p>Descubra sua essência, estilo e autoconfiança</p>
        </div>

        <nav class="footer-nav">

            <a href="sobreMim.html">Sobre Mim</a>
            <a href="referencias.html">Referências</a>
        </nav>
    </footer>

<script>

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var cpfVar = cpf_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      cpfVar == ""  ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" 
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Todos os campos estão em branco!)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    /*for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }*/

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        cpfServer: cpfVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

</script>
